[project]
name = "friday-ai"
version = "1.8.0"
description = "F.R.I.D.A.Y — a local, tool-using agentic assistant with persistent memory."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "google-genai>=1.0.0",
    "google-api-python-client>=2.149.0",
    "google-auth-oauthlib>=1.2.1",
    "groq>=0.11.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "ddgs>=9.5.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "openpyxl>=3.1.0",
    "pdfplumber>=0.11.0",
    "PyPDF2>=3.0.0",
    "psutil>=6.0.0",
    "pyperclip>=1.9.0",
    "sympy>=1.13.0",
    "rich>=13.7.0",
    "pint>=0.24.0",
    'pywin32>=306; sys_platform == "win32"',
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
friday = "friday:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["friday", "config", "persona", "version"]
packages = ["core", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# friday.py silences library warnings before importing them on purpose.
"friday.py" = ["E402"]
