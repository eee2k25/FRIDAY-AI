name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python
        run: |
          python -m py_compile start_friday.py friday.py
          if [ -f gui.py ]; then python -m py_compile gui.py; fi

      - name: Fail if secrets or junk were committed
        run: |
          set -e
          if [ -f .env ]; then
            echo ".env must not be in the repo"
            exit 1
          fi
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo ".env is tracked by git"
            exit 1
          fi
          if git grep -nE "gsk_[A-Za-z0-9]{20,}|sk-or-v1-" -- ':!.github' ':!*.md' >/dev/null 2>&1; then
            echo "Possible API key in tracked files"
            git grep -nE "gsk_[A-Za-z0-9]{20,}|sk-or-v1-" -- ':!.github' ':!*.md' || true
            exit 1
          fi